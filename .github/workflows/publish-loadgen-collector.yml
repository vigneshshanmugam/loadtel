name: Publish Loadgen Collector Image

on:
  workflow_dispatch:
    inputs:
      collector_version:
        description: 'Version tag for GHCR image (e.g. 0.127.0)'
        required: true
        type: string
      otelsoak_ref:
        description: 'Git ref for otelsoak go install (commit, tag, branch)'
        required: false
        default: 'main'
        type: string

jobs:
  publish:
    name: Build and Push GHCR Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        run: |
          version_tag="ghcr.io/${{ github.repository_owner }}/loadtel-loadgen-collector:v${{ inputs.collector_version }}"
          echo "tags=${version_tag},ghcr.io/${{ github.repository_owner }}/loadtel-loadgen-collector:latest" >> "${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/loadgen-collector/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            OTELSOAK_REF=${{ inputs.otelsoak_ref }}
